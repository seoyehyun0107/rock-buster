<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1260"/><stop offset="1" stop-color="#0E0626"/></linearGradient>
  <radialGradient id="neb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5B2A9E" stop-opacity=".55"/><stop offset="1" stop-color="#5B2A9E" stop-opacity="0"/></radialGradient>
  <radialGradient id="white" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9E6F7"/><stop offset="1" stop-color="#A9A3C9"/></radialGradient>
  <radialGradient id="screen" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#2A3170"/><stop offset="1" stop-color="#141838"/></radialGradient>
  <radialGradient id="cyan" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#C8F4FF"/><stop offset=".5" stop-color="#3BB4F5"/><stop offset="1" stop-color="#1A6FC4"/></radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset=".5" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <path id="star" d="M0,-16 L4.5,-5 L16,-5 L7,2 L10,14 L0,7 L-10,14 L-7,2 L-16,-5 L-4.5,-5 Z"/>
  <path id="spark" d="M0,-10 Q1.5,-1.5 10,0 Q1.5,1.5 0,10 Q-1.5,1.5 -10,0 Q-1.5,-1.5 0,-10Z"/>
</defs>

<rect width="1800" height="860" fill="url(#bg)"/>
<ellipse cx="300" cy="420" rx="420" ry="320" fill="url(#neb)"/>
<ellipse cx="1500" cy="460" rx="420" ry="320" fill="url(#neb)"/>
<g fill="#fff">
  <circle cx="80" cy="90" r="2"/><circle cx="520" cy="140" r="2.5"/><circle cx="700" cy="60" r="2"/><circle cx="960" cy="120" r="2"/>
  <circle cx="1240" cy="70" r="2.5"/><circle cx="1650" cy="150" r="2"/><circle cx="1720" cy="620" r="2"/><circle cx="60" cy="560" r="2.5"/>
  <circle cx="640" cy="700" r="2"/><circle cx="1180" cy="760" r="2"/><circle cx="880" cy="420" r="1.5"/><circle cx="1400" cy="300" r="1.5"/>
  <use href="#spark" x="130" y="300" fill="#C9BFF0"/><use href="#spark" x="1080" y="230" fill="#C9BFF0"/><use href="#spark" x="1700" y="400"/><use href="#spark" x="540" y="560" fill="#E35BFF"/>
</g>

<!-- ============ FRONT ============ -->
<g transform="translate(300,0)">
  <ellipse cx="0" cy="730" rx="110" ry="16" fill="#0E0626" opacity=".7"/>
  <!-- legs -->
  <rect x="-58" y="600" width="42" height="90" rx="21" fill="url(#white)"/>
  <rect x="16" y="600" width="42" height="90" rx="21" fill="url(#white)"/>
  <ellipse cx="-40" cy="692" rx="34" ry="20" fill="url(#cyan)"/>
  <ellipse cx="40" cy="692" rx="34" ry="20" fill="url(#cyan)"/>
  <!-- arms -->
  <ellipse cx="-104" cy="525" rx="24" ry="58" transform="rotate(18 -104 525)" fill="url(#white)"/>
  <ellipse cx="104" cy="525" rx="24" ry="58" transform="rotate(-18 104 525)" fill="url(#white)"/>
  <circle cx="-122" cy="578" r="20" fill="url(#cyan)"/>
  <circle cx="122" cy="578" r="20" fill="url(#cyan)"/>
  <!-- body -->
  <ellipse cx="0" cy="530" rx="88" ry="96" fill="url(#white)"/>
  <ellipse cx="-22" cy="470" rx="40" ry="18" fill="url(#gloss)"/>
  <circle cx="0" cy="535" r="40" fill="#141838"/>
  <circle cx="0" cy="535" r="30" fill="url(#cyan)" filter="url(#glow)"/>
  <use href="#star" x="0" y="536" fill="#fff" transform="translate(0,0)" opacity=".9"/>
  <!-- neck -->
  <rect x="-24" y="425" width="48" height="20" rx="8" fill="#A9A3C9"/>
  <!-- antenna -->
  <rect x="-4" y="170" width="8" height="55" rx="4" fill="#A9A3C9"/>
  <use href="#star" x="0" y="160" fill="#FFC23D" filter="url(#glow)" transform="scale(1)"/>
  <!-- ears -->
  <circle cx="-138" cy="335" r="32" fill="url(#white)"/>
  <circle cx="138" cy="335" r="32" fill="url(#white)"/>
  <circle cx="-142" cy="335" r="19" fill="url(#cyan)"/>
  <circle cx="142" cy="335" r="19" fill="url(#cyan)"/>
  <!-- head -->
  <ellipse cx="0" cy="325" rx="135" ry="115" fill="url(#white)"/>
  <ellipse cx="-45" cy="245" rx="60" ry="22" fill="url(#gloss)"/>
  <!-- face screen -->
  <rect x="-100" y="268" width="200" height="140" rx="70" fill="url(#screen)"/>
  <path d="M-78,295 Q-40,276 10,280" stroke="#fff" stroke-opacity=".25" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g filter="url(#glow)" fill="#7FE0FF">
    <rect x="-52" y="312" width="26" height="40" rx="13"/>
    <rect x="26" y="312" width="26" height="40" rx="13"/>
    <path d="M-16,372 Q0,386 16,372" stroke="#7FE0FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <ellipse cx="-68" cy="368" rx="13" ry="7" fill="#FF4FA3" opacity=".7"/>
  <ellipse cx="68" cy="368" rx="13" ry="7" fill="#FF4FA3" opacity=".7"/>
</g>

<!-- ============ SIDE (facing right) ============ -->
<g transform="translate(900,0)">
  <ellipse cx="0" cy="730" rx="100" ry="16" fill="#0E0626" opacity=".7"/>
  <!-- jetpack (behind, left) -->
  <rect x="-108" y="460" width="46" height="120" rx="20" fill="url(#white)"/>
  <rect x="-100" y="572" width="30" height="18" rx="6" fill="#A9A3C9"/>
  <!-- back leg -->
  <rect x="-12" y="600" width="40" height="88" rx="20" fill="#A9A3C9"/>
  <ellipse cx="18" cy="692" rx="36" ry="19" fill="#1A6FC4"/>
  <!-- body -->
  <ellipse cx="0" cy="530" rx="74" ry="96" fill="url(#white)"/>
  <ellipse cx="-14" cy="470" rx="32" ry="16" fill="url(#gloss)"/>
  <!-- core peek -->
  <path d="M62,500 Q82,535 62,570 Q52,535 62,500Z" fill="url(#cyan)" filter="url(#glow)"/>
  <!-- front leg -->
  <rect x="-24" y="604" width="42" height="88" rx="21" fill="url(#white)"/>
  <ellipse cx="8" cy="694" rx="38" ry="20" fill="url(#cyan)"/>
  <!-- arm -->
  <ellipse cx="4" cy="530" rx="24" ry="58" transform="rotate(-8 4 530)" fill="url(#white)"/>
  <ellipse cx="0" cy="510" rx="14" ry="26" fill="url(#gloss)"/>
  <circle cx="12" cy="586" r="20" fill="url(#cyan)"/>
  <!-- neck -->
  <rect x="-22" y="425" width="44" height="20" rx="8" fill="#A9A3C9"/>
  <!-- antenna -->
  <rect x="-4" y="170" width="8" height="55" rx="4" fill="#A9A3C9"/>
  <use href="#star" x="0" y="160" fill="#FFC23D" filter="url(#glow)"/>
  <!-- head -->
  <ellipse cx="0" cy="325" rx="128" ry="115" fill="url(#white)"/>
  <ellipse cx="-30" cy="245" rx="55" ry="20" fill="url(#gloss)"/>
  <!-- face screen in profile -->
  <clipPath id="headclip"><ellipse cx="0" cy="325" rx="128" ry="115"/></clipPath>
  <g clip-path="url(#headclip)">
    <ellipse cx="128" cy="338" rx="62" ry="72" fill="url(#screen)"/>
  </g>
  <g filter="url(#glow)" fill="#7FE0FF">
    <rect x="96" y="314" width="14" height="38" rx="7"/>
    <path d="M100,375 Q110,382 118,374" stroke="#7FE0FF" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <ellipse cx="88" cy="370" rx="8" ry="6" fill="#FF4FA3" opacity=".7"/>
  <!-- ear disc -->
  <circle cx="-10" cy="335" r="40" fill="#E9E6F7" stroke="#A9A3C9" stroke-width="4"/>
  <circle cx="-10" cy="335" r="25" fill="url(#cyan)"/>
  <circle cx="-18" cy="326" r="7" fill="#fff" opacity=".7"/>
</g>

<!-- ============ BACK ============ -->
<g transform="translate(1500,0)">
  <ellipse cx="0" cy="730" rx="110" ry="16" fill="#0E0626" opacity=".7"/>
  <!-- legs -->
  <rect x="-58" y="600" width="42" height="90" rx="21" fill="url(#white)"/>
  <rect x="16" y="600" width="42" height="90" rx="21" fill="url(#white)"/>
  <ellipse cx="-40" cy="692" rx="34" ry="20" fill="url(#cyan)"/>
  <ellipse cx="40" cy="692" rx="34" ry="20" fill="url(#cyan)"/>
  <!-- arms -->
  <ellipse cx="-104" cy="525" rx="24" ry="58" transform="rotate(18 -104 525)" fill="url(#white)"/>
  <ellipse cx="104" cy="525" rx="24" ry="58" transform="rotate(-18 104 525)" fill="url(#white)"/>
  <circle cx="-122" cy="578" r="20" fill="url(#cyan)"/>
  <circle cx="122" cy="578" r="20" fill="url(#cyan)"/>
  <!-- body -->
  <ellipse cx="0" cy="530" rx="88" ry="96" fill="url(#white)"/>
  <!-- jetpack -->
  <rect x="-62" y="460" width="124" height="130" rx="34" fill="url(#white)" stroke="#A9A3C9" stroke-width="4"/>
  <ellipse cx="-20" cy="482" rx="30" ry="10" fill="url(#gloss)"/>
  <circle cx="0" cy="520" r="18" fill="url(#cyan)" filter="url(#glow)"/>
  <rect x="-50" y="580" width="34" height="22" rx="8" fill="#A9A3C9"/>
  <rect x="16" y="580" width="34" height="22" rx="8" fill="#A9A3C9"/>
  <path d="M-46,602 Q-33,650 -20,602Z" fill="url(#flame)" filter="url(#glow)"/>
  <path d="M20,602 Q33,650 46,602Z" fill="url(#flame)" filter="url(#glow)"/>
  <!-- neck -->
  <rect x="-24" y="425" width="48" height="20" rx="8" fill="#A9A3C9"/>
  <!-- antenna -->
  <rect x="-4" y="170" width="8" height="55" rx="4" fill="#A9A3C9"/>
  <use href="#star" x="0" y="160" fill="#FFC23D" filter="url(#glow)"/>
  <!-- ears -->
  <circle cx="-138" cy="335" r="32" fill="url(#white)"/>
  <circle cx="138" cy="335" r="32" fill="url(#white)"/>
  <circle cx="-142" cy="335" r="19" fill="url(#cyan)"/>
  <circle cx="142" cy="335" r="19" fill="url(#cyan)"/>
  <!-- head -->
  <ellipse cx="0" cy="325" rx="135" ry="115" fill="url(#white)"/>
  <ellipse cx="45" cy="245" rx="60" ry="22" fill="url(#gloss)"/>
  <!-- back panel with vents -->
  <rect x="-60" y="320" width="120" height="70" rx="22" fill="#E9E6F7" stroke="#A9A3C9" stroke-width="4"/>
  <g stroke="#A9A3C9" stroke-width="6" stroke-linecap="round">
    <line x1="-34" y1="342" x2="34" y2="342"/><line x1="-34" y1="356" x2="34" y2="356"/><line x1="-34" y1="370" x2="34" y2="370"/>
  </g>
  <circle cx="0" cy="295" r="8" fill="#FF4FA3"/>
</g>

<!-- labels -->
<g font-family="Lilita One, Fredoka, sans-serif" font-size="44" text-anchor="middle" fill="#9BE7FF" stroke="#3A1F8F" stroke-width="6" paint-order="stroke fill">
  <text x="300" y="815">FRONT</text>
  <text x="900" y="815">SIDE</text>
  <text x="1500" y="815">BACK</text>
</g>
</svg>
